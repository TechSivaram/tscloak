<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSCloak | Client Users</title>
    <link rel="icon" type="image/png" href="/assets/tscloak-icon.png">
    <link rel="stylesheet" href="./css/client-admin.css">
</head>

<body>
    <div class="app-shell">

        <aside class="sidebar">
            <div class="brand">
                <img src="../assets/tscloak-icon.png" alt="TSCloak">
                <strong>TSCloak</strong>
                <small>Client Administration</small>
            </div>

            <nav>
                <a href="./dashboard.html">Dashboard</a>
                <a class="active" href="./users.html">Users</a>
                <a href="./profile.html">Profile</a>
            </nav>

            <button class="signout" data-logout>
                Sign out
            </button>
        </aside>

        <div class="main-area">

            <header>
                <div>
                    <span class="eyebrow">Client administration</span>
                    <h1>Users</h1>
                </div>

                <div class="user-chip">
                    <strong data-user-name>Administrator</strong>
                    <span data-user-role>IDP_CLIENT_ADMIN</span>
                </div>
            </header>

            <main>

                <section class="hero compact">
                    <div>
                        <span class="eyebrow">Client directory</span>
                        <h2>Users</h2>
                        <p>Manage users assigned to your client.</p>
                    </div>

                    <button class="primary" id="showUserForm">
                        Create user
                    </button>
                </section>

                <section class="panel">

                    <div class="panel-heading">
                        <h3>Registered users</h3>

                        <button class="refresh" id="refreshUsers">
                            Refresh
                        </button>
                    </div>

                    <p class="message" id="message"></p>

                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Roles</th>
                                    <th>Status</th>
                                    <th>Created</th>
                                    <th></th>
                                </tr>
                            </thead>

                            <tbody id="userRows">
                                <tr>
                                    <td colspan="6">
                                        Loading users...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </section>

                <section class="panel form-panel" id="userFormPanel" hidden>

                    <h3>Create user</h3>

                    <form id="userForm">

                        <label>
                            Username
                            <input
                                name="username"
                                required
                                minlength="3"
                            >
                        </label>

                        <label>
                            Email
                            <input
                                name="email"
                                type="email"
                                required
                            >
                        </label>

                        <label>
                            Password
                            <input
                                name="password"
                                type="password"
                                required
                                minlength="8"
                            >
                        </label>

                        <div class="actions">
                            <button
                                type="button"
                                class="secondary"
                                id="cancelUser"
                            >
                                Cancel
                            </button>

                            <button
                                type="submit"
                                class="primary"
                            >
                                Create user
                            </button>
                        </div>

                    </form>

                </section>

            </main>

        </div>
    </div>

    <script src="./js/common.js"></script>
    <script src="./js/users.js"></script>
</body>

</html>
