<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSCloak | Client Administration</title>
    <link rel="icon" type="image/png" href="/assets/tscloak-icon.png">
    <link rel="stylesheet" href="/idp-client-admin/css/client-admin.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#101827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/pwa-192x192.png">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .catch((error) => console.error('TSCloak service worker registration failed:', error));
        });
      }
    </script>
</head>

<body>
    <main class="login-shell">
        <section class="login-card">
            <img src="/assets/tscloak-icon.png" alt="TSCloak">
            <h1>TSCloak</h1>
            <p class="portal-title">Client Administration</p>
            <p>Manage users and access for your client.</p>
            <button id="loginButton">Sign in</button>
            <p class="login-error" id="loginError"></p>
        </section>
    </main>
    <script src="/idp-client-admin/js/auth.js"></script>
</body>

</html>
