<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSCloak | Roles</title>
    <link rel="icon" type="image/png" href="/assets/tscloak-icon.png">
    <link rel="stylesheet" href="./css/dashboard.css">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#101827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="/assets/pwa-192x192.png">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .catch((error) => console.error('TSCloak service worker registration failed:', error));
        });
      }
    </script>
</head>

<body class="page-roles">
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark"><img src="../assets/tscloak-icon.png" alt="TSCloak"></div>
                <div>
                    <div class="brand-name">TSCloak</div>
                    <div class="brand-subtitle">Administration</div>
                </div>
            </div>
            <nav class="navigation"><a class="nav-item" href="./dashboard.html"><span>⌂</span>Dashboard</a><a
                    class="nav-item" href="./clients.html"><span>▣</span>Clients</a><a class="nav-item"
                    href="./users.html"><span>♙</span>Users</a><a class="nav-item active"
                    href="./roles.html"><span>◆</span>Roles</a>
                <div class="nav-section-title">Registration</div><a class="nav-item"
                    href="./initial-access-tokens.html"><span>⌁</span>Initial Access Tokens</a>
                <div class="nav-section-title">Configuration</div><a class="nav-item"
                    href="./security-policy.html"><span>⚙</span>Security Policy</a>
            </nav>
        </aside>
        <div class="main-area">
            <header class="topbar">
                <div class="page-heading"><span class="breadcrumb">TSCloak / Administration</span>
                    <h1>Roles</h1>
                </div>
                <div class="topbar-actions"><span data-user-name>Administrator</span><button class="text-button"
                        data-logout>Sign out</button></div>
            </header>
            <main class="content">
                <section class="panel">
                    <div class="panel-header">
                        <div>
                            <p class="eyebrow">Authorization</p>
                            <h3>Roles</h3>
                        </div><button class="button primary" id="showRoleForm">Create role</button>
                    </div>
                    <p data-message></p>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>ID</th>
                                </tr>
                            </thead>
                            <tbody id="roleRows">
                                <tr>
                                    <td colspan="3">Loading roles...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
                <section class="panel" id="roleFormPanel" hidden>
                    <div class="panel-header">
                        <div>
                            <p class="eyebrow">Authorization</p>
                            <h3>Create role</h3>
                        </div>
                    </div>
                    <form id="roleForm" class="admin-form"><label>Name<input name="name"
                                required></label><label>Description<input name="description"></label><button
                            class="button primary" type="submit">Create role</button></form>
                </section>
            </main>
        </div>
    </div>
    <script src="./js/admin-common.js"></script>
</body>

</html>
