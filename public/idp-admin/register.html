<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSCloak | Register Application</title>
  <link rel="icon" type="image/png" href="/assets/tscloak-icon.png">
  <link rel="stylesheet" href="./css/register.css">
</head>

<body>
  <main class="registration-shell">
    <section class="registration-card">
      <div class="registration-brand"><img src="../assets/tscloak-icon.png" alt="TSCloak"><span>TSCloak</span></div>
      <p class="eyebrow">Application registration</p>
      <h1>Register your application</h1>
      <p class="intro">Enter your application details to receive its OAuth/OIDC client credentials and client
        administration URL.</p>
      <div class="notice" id="tokenNotice">Registration invitation detected.</div>
      <form id="registrationForm">
        <label>Application name<input name="client_name" required minlength="2"
            placeholder="My Web Application"></label>
        <label>Redirect URIs<textarea name="redirect_uris" required
            placeholder="https://app.example.com/callback"></textarea><small>Enter one URI per line.</small></label>
        <label>Post-logout redirect URIs<textarea name="post_logout_redirect_uris"
            placeholder="https://app.example.com/logout/callback"></textarea><small>Optional. Enter one URI per
            line.</small></label>
        <label>Allowed scopes<input name="scope" value="openid profile email roles"></label>
        <label>Grant types<input name="grant_types" value="authorization_code refresh_token"></label>
        <label>Response types<input name="response_types" value="code"></label>
        <label>Token endpoint authentication<select name="token_endpoint_auth_method">
            <option value="none">None (public client)</option>
            <option value="client_secret_basic">Client secret basic</option>
            <option value="client_secret_post">Client secret post</option>
          </select></label>
        <label>Interaction mode<select name="interaction_mode">
            <option value="hosted">Hosted TSCloak pages</option>
            <option value="external">External application pages</option>
          </select></label>
        <label>External login page URL<input name="interaction_login_url" type="url"
            placeholder="https://app.example.com/login"></label>
        <label>External consent page URL<input name="interaction_consent_url" type="url"
            placeholder="https://app.example.com/consent"></label>
        <button type="submit">Register application</button>
      </form>
      <div class="result" id="result" hidden></div>
    </section>
  </main>
  <script src="./js/register.js"></script>
</body>

</html>
