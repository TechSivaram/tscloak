<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TSCloak | Reset Password</title>

    <link
        rel="icon"
        type="image/png"
        href="/assets/tscloak-icon.png"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(37, 99, 235, 0.08),
                    transparent 35%
                ),
                #f4f6f8;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: #1f2937;
        }

        .page {
            width: 100%;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;

            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;

            padding: 40px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;

            margin-bottom: 32px;
        }

        .brand-mark {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;
            overflow: hidden;
        }

        .brand-mark img {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            margin-top: 2px;
            font-size: 12px;
            color: #6b7280;
        }

        .heading {
            text-align: center;
            margin-bottom: 28px;
        }

        .heading .eyebrow {
            margin: 0 0 8px;

            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;

            color: #2563eb;
        }

        .heading h1 {
            margin: 0;

            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;

            color: #111827;
        }

        .heading p {
            margin: 12px 0 0;

            font-size: 14px;
            line-height: 1.6;

            color: #6b7280;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 600;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            background: #ffffff;

            font-size: 14px;
            color: #111827;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        input::placeholder {
            color: #9ca3af;
        }

        .password-hint {
            margin-top: 7px;

            font-size: 12px;
            line-height: 1.5;

            color: #6b7280;
        }

        .button {
            width: 100%;

            border: 0;
            border-radius: 7px;

            padding: 13px 16px;

            background: #2563eb;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s ease,
                opacity 0.15s ease;
        }

        .button:hover {
            background: #1d4ed8;
        }

        .button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;

            margin-bottom: 20px;
            padding: 12px 14px;

            border-radius: 7px;

            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
        }

        .message.success {
            display: block;

            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .message.info {
            display: block;

            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
        }

        .footer {
            margin-top: 28px;

            text-align: center;

            font-size: 12px;
            color: #9ca3af;
        }

        .success-state {
            display: none;
            text-align: center;
        }

        .success-icon {
            width: 52px;
            height: 52px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #dcfce7;
            color: #15803d;

            font-size: 26px;
        }

        .success-state h2 {
            margin: 0 0 10px;

            font-size: 22px;
            color: #111827;
        }

        .success-state p {
            margin: 0;

            font-size: 14px;
            line-height: 1.6;

            color: #6b7280;
        }

        @media (max-width: 480px) {
            .page {
                padding: 16px;
            }

            .card {
                padding: 28px 22px;
                border-radius: 10px;
            }

            .heading h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <!-- Branding -->
        <div class="brand">
            <div class="brand-mark">
                <img
                    src="/assets/tscloak-icon.png"
                    alt="TSCloak"
                >
            </div>

            <div>
                <div class="brand-name">TSCloak</div>
                <div class="brand-subtitle">Identity Provider</div>
            </div>
        </div>

        <!-- Reset form -->
        <div id="resetState">

            <div class="heading">
                <p class="eyebrow">Account security</p>

                <h1>Reset your password</h1>

                <p>
                    Enter a new password for your account.
                </p>
            </div>

            <div
                id="message"
                class="message"
                role="alert"
            ></div>

            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="newPassword">
                        New password
                    </label>

                    <input
                        id="newPassword"
                        name="newPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Enter your new password"
                        minlength="8"
                        required
                    >

                    <div class="password-hint">
                        Your password must contain at least
                        8 characters.
                    </div>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm password
                    </label>

                    <input
                        id="confirmPassword"
                        name="confirmPassword"
                        type="password"
                        autocomplete="new-password"
                        placeholder="Confirm your new password"
                        minlength="8"
                        required
                    >

                </div>

                <button
                    id="submitButton"
                    class="button"
                    type="submit"
                >
                    Reset Password
                </button>

            </form>

        </div>

        <!-- Success -->
        <div
            id="successState"
            class="success-state"
        >
            <div class="success-icon">
                ✓
            </div>

            <h2>Password updated</h2>

            <p>
                Your password has been changed successfully.
                You can now sign in using your new password.
            </p>
        </div>

        <div class="footer">
            TSCloak
        </div>

    </div>

</div>

<script>
    /*
     * TSCloak API endpoint.
     *
     * Change this when your hosted UI and API
     * are deployed to different environments.
     */
    const API_BASE_URL = 'http://localhost:3000';

    const form = document.getElementById(
        'resetPasswordForm'
    );

    const message = document.getElementById(
        'message'
    );

    const submitButton = document.getElementById(
        'submitButton'
    );

    const resetState = document.getElementById(
        'resetState'
    );

    const successState = document.getElementById(
        'successState'
    );

    /*
     * Read the reset token from:
     *
     * /reset-password.html?token=xxxxx
     */
    const params = new URLSearchParams(
        window.location.search
    );

    const token = params.get('token');

    function showMessage(
        text,
        type = 'error'
    ) {
        message.textContent = text;

        message.className =
            `message ${type}`;
    }

    function clearMessage() {
        message.textContent = '';
        message.className = 'message';
    }

    /*
     * A missing token means the page cannot
     * perform a password reset.
     */
    if (!token) {
        showMessage(
            'This password reset link is invalid or incomplete.'
        );

        submitButton.disabled = true;
    }

    form.addEventListener(
        'submit',
        async (event) => {
            event.preventDefault();

            clearMessage();

            const newPassword =
                document.getElementById(
                    'newPassword'
                ).value;

            const confirmPassword =
                document.getElementById(
                    'confirmPassword'
                ).value;

            if (newPassword.length < 8) {
                showMessage(
                    'Password must be at least 8 characters long.'
                );

                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage(
                    'New password and confirmation password do not match.'
                );

                return;
            }

            submitButton.disabled = true;
            submitButton.textContent =
                'Updating password...';

            try {
                const response = await fetch(
                    `/api/account/reset-password`,
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({
                            token,
                            newPassword,
                            confirmPassword
                        })
                    }
                );

                const data =
                    await response.json()
                        .catch(() => ({}));

                if (!response.ok) {
                    throw new Error(
                        data.message ||
                        'Unable to reset your password.'
                    );
                }

                resetState.style.display =
                    'none';

                successState.style.display =
                    'block';

            } catch (error) {

                showMessage(
                    error.message ||
                    'Unable to reset your password.'
                );

                submitButton.disabled = false;

                submitButton.textContent =
                    'Reset Password';
            }
        }
    );
</script>

</body>
</html>
