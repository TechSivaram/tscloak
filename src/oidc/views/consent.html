<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Authorize Application - TSCloak</title>

  <style>
    :root {
      --tscloak-blue: #1f3f82;
      --tscloak-blue-dark: #163266;
      --tscloak-blue-light: #eef3fb;

      --text-primary: #172033;
      --text-muted: #667085;

      --border: #e4e7ec;

      --background: #f5f7fb;

      --deny-bg: #f2f4f7;
      --deny-hover: #e4e7ec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(31, 63, 130, 0.08),
          transparent 40%
        ),
        var(--background);

      color: var(--text-primary);
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .card {
      background: white;

      border:
        1px solid rgba(31, 63, 130, 0.08);

      border-radius: 16px;

      padding: 36px 32px;

      box-shadow:
        0 12px 40px rgba(31, 63, 130, 0.10);
    }

    /* =============================================
       TSCloak Branding
    ============================================== */

    .logo {
      text-align: center;

      margin-bottom: 30px;
    }

    .logo-image {
      width: 82px;
      height: 82px;

      display: block;

      object-fit: contain;

      margin: 0 auto 12px;
    }

    .logo-name {
      color: var(--tscloak-blue);

      font-size: 28px;

      font-weight: 700;

      letter-spacing: -0.5px;
    }

    .logo-tagline {
      margin-top: 7px;

      color: var(--text-muted);

      font-size: 13px;

      font-weight: 500;
    }

    /* =============================================
       Heading
    ============================================== */

    h1 {
      margin: 0 0 14px;

      color: var(--text-primary);

      font-size: 23px;

      font-weight: 700;

      text-align: center;
    }

    .description {
      text-align: center;

      color: var(--text-muted);

      margin-bottom: 24px;

      line-height: 1.6;

      font-size: 15px;
    }

    .client-name {
      font-weight: 700;

      color: var(--text-primary);
    }

    /* =============================================
       Permissions
    ============================================== */

    .permissions {
      margin: 24px 0;

      padding: 0;

      list-style: none;

      border:
        1px solid var(--border);

      border-radius: 10px;

      overflow: hidden;

      background: #fff;
    }

    .permissions li {
      padding: 14px 16px;

      border-bottom:
        1px solid var(--border);
    }

    .permissions li:last-child {
      border-bottom: none;
    }

    .scope-name {
      display: block;

      color: var(--text-primary);

      font-weight: 650;

      font-size: 14px;
    }

    .scope-description {
      display: block;

      color: var(--text-muted);

      font-size: 13px;

      margin-top: 5px;

      line-height: 1.5;
    }

    /* =============================================
       Actions
    ============================================== */

    .actions {
      display: flex;

      gap: 12px;

      margin-top: 26px;
    }

    button {
      flex: 1;

      border: none;

      border-radius: 8px;

      padding: 13px 16px;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;
    }

    .allow {
      background: var(--tscloak-blue);

      color: white;

      box-shadow:
        0 5px 12px rgba(31, 63, 130, 0.20);
    }

    .allow:hover {
      background: var(--tscloak-blue-dark);

      box-shadow:
        0 7px 18px rgba(31, 63, 130, 0.25);
    }

    .deny {
      background: var(--deny-bg);

      color: #344054;

      border:
        1px solid var(--border);
    }

    .deny:hover {
      background: var(--deny-hover);
    }

    button:active {
      transform: translateY(1px);
    }

    /* =============================================
       Footer
    ============================================== */

    .footer {
      margin-top: 26px;

      text-align: center;

      color: #98a2b3;

      font-size: 11px;
    }

    .footer strong {
      color: var(--tscloak-blue);
    }

    /* =============================================
       Mobile
    ============================================== */

    @media (max-width: 480px) {

      body {
        padding: 14px;
      }

      .card {
        padding: 30px 22px;
      }

      .logo-image {
        width: 72px;
        height: 72px;
      }

      .actions {
        flex-direction: column-reverse;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- =============================================
           TSCloak Branding
      ============================================== -->

      <div class="logo">

        <img
          src="/assets/tscloak-icon.png"
          alt="TSCloak"
          class="logo-image"
        />

        <div class="logo-name">
          TSCloak
        </div>

        <div class="logo-tagline">
          Secure Identities. Trusted Access.
        </div>

      </div>


      <!-- =============================================
           Authorization Information
      ============================================== -->

      <h1>
        Authorize Application
      </h1>

      <div class="description">

        <span class="client-name">
          {{clientName}}
        </span>

        is requesting access to your account.

      </div>


      <!-- =============================================
           Requested Permissions
      ============================================== -->

      <ul class="permissions">
        {{scopes}}
      </ul>


      <!-- =============================================
           Consent Actions
      ============================================== -->

      <form
        method="post"
        action="/interaction/{{UID}}/consent"
      >

        <div class="actions">

          <!-- Reject must match backend contract -->
          <button
            type="submit"
            class="deny"
            name="decision"
            value="reject"
          >
            Deny
          </button>


          <!-- Accept must match backend contract -->
          <button
            type="submit"
            class="allow"
            name="decision"
            value="accept"
          >
            Allow
          </button>

        </div>

      </form>


      <!-- =============================================
           Footer
      ============================================== -->

      <div class="footer">
        Secured by <strong>TSCloak</strong>
      </div>

    </div>

  </div>

</body>

</html>
