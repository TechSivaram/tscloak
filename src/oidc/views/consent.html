<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Authorize Application - TSCloak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .card {
      background: white;

      border-radius: 12px;

      padding: 32px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;

      font-size: 24px;
      font-weight: bold;

      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;

      font-size: 22px;

      text-align: center;
    }

    .description {
      text-align: center;

      color: #666;

      margin-bottom: 24px;

      line-height: 1.5;
    }

    .client-name {
      font-weight: bold;
      color: #222;
    }

    .permissions-title {
      margin-bottom: 12px;

      font-size: 14px;
      font-weight: 600;

      color: #444;
    }

    .permissions {
      margin: 0;
      padding: 0;

      list-style: none;

      border: 1px solid #eee;
      border-radius: 8px;

      overflow: hidden;
    }

    .scope-item {
      padding: 14px 16px;

      border-bottom: 1px solid #eee;
    }

    .scope-item:last-child {
      border-bottom: none;
    }

    .scope-name {
      font-weight: 600;
      color: #222;

      margin-bottom: 4px;
    }

    .scope-description {
      display: block;

      color: #777;

      font-size: 14px;

      line-height: 1.4;
    }

    .actions {
      display: flex;

      gap: 12px;

      margin-top: 24px;
    }

    button {
      flex: 1;

      border: none;
      border-radius: 6px;

      padding: 12px;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        opacity 0.2s ease,
        transform 0.1s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    .allow {
      background: #2563eb;
      color: white;
    }

    .deny {
      background: #e5e7eb;
      color: #333;
    }

    .footer {
      margin-top: 20px;

      text-align: center;

      font-size: 12px;
      color: #999;
    }

    .error {
      margin-bottom: 18px;

      padding: 10px;

      background: #fff0f0;

      border: 1px solid #ffcccc;

      border-radius: 5px;

      color: #c00;

      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <!-- TSCloak Branding -->
      <div class="logo">
        TSCloak
      </div>

      <!-- Title -->
      <h1>
        Authorize Application
      </h1>

      <!-- Client Information -->
      <div class="description">
        <span class="client-name">
          {{clientName}}
        </span>

        is requesting access to your account.
      </div>

      <!-- Error -->
      {{ERROR}}

      <!-- Permissions -->
      <div class="permissions-title">
        This application will be able to:
      </div>

      <ul class="permissions">
        {{scopes}}
      </ul>

      <!-- Consent Form -->
      <form method="POST" action="/interaction/{{UID}}/consent">

        <div class="actions">

          <!-- Reject Consent -->
          <button type="submit" class="deny" name="decision" value="reject">
            Deny
          </button>

          <!-- Accept Consent -->
          <button type="submit" class="allow" name="decision" value="accept">
            Allow
          </button>

        </div>

      </form>

      <div class="footer">
        You can revoke this application's access later.
      </div>

    </div>

  </div>

</body>

</html>
