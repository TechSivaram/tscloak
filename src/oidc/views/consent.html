<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Authorize Application</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 22px;
      text-align: center;
      margin-bottom: 12px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .client-name {
      font-weight: bold;
      color: #222;
    }

    .permissions {
      margin: 24px 0;
      padding: 0;
      list-style: none;
    }

    .permissions li {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .permissions li:last-child {
      border-bottom: none;
    }

    .scope-name {
      font-weight: 600;
    }

    .scope-description {
      display: block;
      color: #777;
      font-size: 14px;
      margin-top: 4px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 6px;
      padding: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .allow {
      background: #2563eb;
      color: white;
    }

    .deny {
      background: #e5e7eb;
      color: #333;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <div class="logo">
        TSCloak
      </div>

      <h1>Authorize Application</h1>

      <div class="description">
        <span class="client-name">{{clientName}}</span>
        is requesting access to your account.
      </div>

      <ul class="permissions">
        {{scopes}}
      </ul>

      <form method="post">

        <div class="actions">

          <button
            type="submit"
            class="deny"
            name="decision"
            value="deny"
          >
            Deny
          </button>

          <button
            type="submit"
            class="allow"
            name="decision"
            value="allow"
          >
            Allow
          </button>

        </div>

      </form>

    </div>
  </div>

</body>
</html>
