<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Sign in - TSCloak</title>

  <link
    rel="icon"
    type="image/png"
    href="/assets/tscloak-icon.png"
  />

  <style>
    :root {
      --tscloak-blue: #1f3f82;
      --tscloak-blue-dark: #163266;
      --tscloak-blue-light: #eef3fb;

      --text-primary: #172033;
      --text-muted: #667085;

      --border: #d0d5dd;
      --background: #f5f7fa;

      --error-bg: #fff0f0;
      --error-border: #ffcccc;
      --error-text: #c00;

      --success-bg: #ecfdf3;
      --success-border: #abefc6;
      --success-text: #067647;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family: Inter, Arial, Helvetica, sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(31, 63, 130, 0.08),
          transparent 40%
        ),
        var(--background);
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      padding: 36px 32px;

      background: white;

      border: 1px solid rgba(31, 63, 130, 0.08);
      border-radius: 16px;

      box-shadow:
        0 12px 40px rgba(31, 63, 130, 0.10);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-image {
      width: 82px;
      height: 82px;

      display: block;

      object-fit: contain;

      margin: 0 auto 12px;
    }

    .logo h1 {
      margin: 0;

      color: var(--tscloak-blue);

      font-size: 30px;
      font-weight: 700;

      letter-spacing: -0.5px;
    }

    .logo p {
      margin: 7px 0 0;

      color: var(--text-muted);

      font-size: 13px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: var(--text-primary);

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid var(--border);
      border-radius: 8px;

      color: var(--text-primary);
      background: white;

      font-size: 15px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;

      border-color: var(--tscloak-blue);

      box-shadow:
        0 0 0 3px rgba(31, 63, 130, 0.12);
    }

    button {
      width: 100%;

      padding: 13px;

      border: none;
      border-radius: 8px;

      background: var(--tscloak-blue);
      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 5px 12px rgba(31, 63, 130, 0.20);
    }

    button:hover {
      background: var(--tscloak-blue-dark);

      box-shadow:
        0 7px 18px rgba(31, 63, 130, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.65;

      cursor: not-allowed;

      box-shadow: none;
    }

    .error {
      margin-bottom: 20px;

      padding: 12px;

      background: var(--error-bg);

      border: 1px solid var(--error-border);

      border-radius: 8px;

      color: var(--error-text);

      font-size: 14px;
    }

    .forgot-password {
      margin-top: 14px;

      text-align: center;
    }

    .forgot-password a {
      color: var(--tscloak-blue);

      font-size: 13px;
      font-weight: 500;

      text-decoration: none;
    }

    .forgot-password a:hover {
      text-decoration: underline;
    }

    .forgot-password-panel {
      margin-top: 4px;
    }

    .forgot-password-header {
      margin-bottom: 24px;

      text-align: center;
    }

    .forgot-password-header h2 {
      margin: 0 0 8px;

      color: var(--text-primary);

      font-size: 22px;
      font-weight: 700;
    }

    .forgot-password-header p {
      margin: 0;

      color: var(--text-muted);

      font-size: 13px;

      line-height: 1.6;
    }

    .forgot-password-message {
      margin-bottom: 20px;

      padding: 12px;

      border-radius: 8px;

      font-size: 14px;

      line-height: 1.5;
    }

    .forgot-password-message.error {
      background: var(--error-bg);

      border: 1px solid var(--error-border);

      color: var(--error-text);
    }

    .forgot-password-message.success {
      background: var(--success-bg);

      border: 1px solid var(--success-border);

      color: var(--success-text);
    }

    .back-to-login {
      margin-top: 18px;

      text-align: center;
    }

    .back-to-login a {
      color: var(--tscloak-blue);

      font-size: 13px;
      font-weight: 500;

      text-decoration: none;
    }

    .back-to-login a:hover {
      text-decoration: underline;
    }

    .footer {
      margin-top: 26px;

      text-align: center;

      color: #98a2b3;

      font-size: 11px;
    }

    .footer strong {
      color: var(--tscloak-blue);
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .login-container {
        padding: 30px 24px;
      }

      .logo-image {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <img
        src="/assets/tscloak-icon.png"
        alt="TSCloak"
        class="logo-image"
      />

      <h1>TSCloak</h1>

      <p>
        Secure Identities. Trusted Access.
      </p>
    </div>

    {{ERROR}}

    <!-- ========================================================
         LOGIN
         ======================================================== -->

    <div id="loginSection">

      <form
        id="loginForm"
        method="POST"
        action="/interaction/{{UID}}/login"
      >

        <div class="form-group">

          <label for="username">
            Username
          </label>

          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
          />

        </div>

        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />

        </div>

        <button type="submit">
          Sign in
        </button>

      </form>

      <div class="forgot-password">

        <a
          href="#"
          id="forgotPasswordLink"
        >
          Forgot your password?
        </a>

      </div>

    </div>

    <!-- ========================================================
         FORGOT PASSWORD
         ======================================================== -->

    <div
      id="forgotPasswordPanel"
      class="forgot-password-panel"
      hidden
    >

      <div class="forgot-password-header">

        <h2>
          Reset your password
        </h2>

        <p>
          Enter the email address associated with your account.
          If an account exists, we'll send you a password reset link.
        </p>

      </div>

      <div
        id="forgotPasswordMessage"
        class="forgot-password-message"
        hidden
      ></div>

      <form id="forgotPasswordForm">

        <div class="form-group">

          <label for="forgotEmail">
            Email
          </label>

          <input
            id="forgotEmail"
            name="email"
            type="email"
            autocomplete="email"
            required
          />

        </div>

        <button
          id="forgotPasswordButton"
          type="submit"
        >
          Send reset link
        </button>

      </form>

      <div class="back-to-login">

        <a
          href="#"
          id="backToLogin"
        >
          Back to sign in
        </a>

      </div>

    </div>

    <div class="footer">
      Secured by <strong>TSCloak</strong>
    </div>

  </div>

  <script>
    /*
     * This value comes directly from the current OIDC interaction.
     *
     * The server replaces:
     *
     *   {{CLIENT_ID}}
     *
     * with details.params.client_id before sending this page.
     *
     * The user therefore does not need to enter the Client ID.
     */
    const clientId = '{{CLIENT_ID}}';

    const loginSection =
      document.getElementById('loginSection');

    const forgotPasswordLink =
      document.getElementById('forgotPasswordLink');

    const forgotPasswordPanel =
      document.getElementById('forgotPasswordPanel');

    const backToLogin =
      document.getElementById('backToLogin');

    const forgotPasswordForm =
      document.getElementById('forgotPasswordForm');

    const forgotPasswordMessage =
      document.getElementById('forgotPasswordMessage');

    const forgotPasswordButton =
      document.getElementById('forgotPasswordButton');

    function showForgotPasswordMessage(
      message,
      error = false,
    ) {
      forgotPasswordMessage.textContent = message;

      forgotPasswordMessage.className =
        error
          ? 'forgot-password-message error'
          : 'forgot-password-message success';

      forgotPasswordMessage.hidden = false;
    }

    function clearForgotPasswordMessage() {
      forgotPasswordMessage.textContent = '';

      forgotPasswordMessage.className =
        'forgot-password-message';

      forgotPasswordMessage.hidden = true;
    }

    forgotPasswordLink.addEventListener(
      'click',
      event => {
        event.preventDefault();

        clearForgotPasswordMessage();

        loginSection.hidden = true;

        forgotPasswordPanel.hidden = false;

        document
          .getElementById('forgotEmail')
          .focus();
      },
    );

    backToLogin.addEventListener(
      'click',
      event => {
        event.preventDefault();

        clearForgotPasswordMessage();

        forgotPasswordPanel.hidden = true;

        loginSection.hidden = false;

        document
          .getElementById('username')
          .focus();
      },
    );

    forgotPasswordForm.addEventListener(
      'submit',
      async event => {
        event.preventDefault();

        clearForgotPasswordMessage();

        const email =
          document
            .getElementById('forgotEmail')
            .value
            .trim();

        if (!clientId) {
          showForgotPasswordMessage(
            'Unable to determine the application client.',
            true,
          );

          return;
        }

        if (!email) {
          showForgotPasswordMessage(
            'Email address is required.',
            true,
          );

          document
            .getElementById('forgotEmail')
            .focus();

          return;
        }

        const emailInput =
          document.getElementById('forgotEmail');

        if (!emailInput.checkValidity()) {
          showForgotPasswordMessage(
            'Enter a valid email address.',
            true,
          );

          emailInput.focus();

          return;
        }

        forgotPasswordButton.disabled = true;

        forgotPasswordButton.textContent =
          'Sending...';

        try {
          const response =
            await fetch(
              '/api/account/forgot-password',
              {
                method: 'POST',

                headers: {
                  'Content-Type': 'application/json',
                  'Accept': 'application/json',
                },

                body: JSON.stringify({
                  clientId,
                  email,
                }),
              },
            );

          const data =
            await response
              .json()
              .catch(() => ({}));

          if (!response.ok) {
            throw new Error(
              data.message ||
              'Unable to process the password reset request.',
            );
          }

          showForgotPasswordMessage(
            data.message ||
            'If an account exists, a password reset link has been sent.',
          );

          forgotPasswordForm.reset();

        } catch (error) {

          showForgotPasswordMessage(
            error instanceof Error
              ? error.message
              : 'Unable to process the password reset request.',
            true,
          );

        } finally {

          forgotPasswordButton.disabled = false;

          forgotPasswordButton.textContent =
            'Send reset link';
        }
      },
    );
  </script>

</body>

</html>
