<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign in - TSCloak</title>

  <style>
    :root {
      --tscloak-blue: #1f3f82;
      --tscloak-blue-dark: #163266;
      --tscloak-blue-light: #eef3fb;

      --text-primary: #172033;
      --text-muted: #667085;

      --border: #d0d5dd;
      --background: #f5f7fa;

      --error-bg: #fff0f0;
      --error-border: #ffcccc;
      --error-text: #c00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(31, 63, 130, 0.08),
          transparent 40%
        ),
        var(--background);
    }

    .login-container {
      width: 100%;
      max-width: 420px;

      padding: 36px 32px;

      background: white;

      border: 1px solid rgba(31, 63, 130, 0.08);

      border-radius: 16px;

      box-shadow:
        0 12px 40px rgba(31, 63, 130, 0.10);
    }

    /* =============================================
       TSCloak Branding
    ============================================== */

    .logo {
      text-align: center;

      margin-bottom: 30px;
    }

    .logo-image {
      width: 82px;
      height: 82px;

      display: block;

      object-fit: contain;

      margin: 0 auto 12px;
    }

    .logo h1 {
      margin: 0;

      color: var(--tscloak-blue);

      font-size: 30px;

      font-weight: 700;

      letter-spacing: -0.5px;
    }

    .logo p {
      margin: 7px 0 0;

      color: var(--text-muted);

      font-size: 13px;

      font-weight: 500;
    }

    /* =============================================
       Form
    ============================================== */

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: var(--text-primary);

      font-size: 14px;

      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 12px 13px;

      border: 1px solid var(--border);

      border-radius: 8px;

      color: var(--text-primary);

      background: white;

      font-size: 15px;

      transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    input:focus {
      outline: none;

      border-color: var(--tscloak-blue);

      box-shadow:
        0 0 0 3px rgba(31, 63, 130, 0.12);
    }

    /* =============================================
       Sign In Button
    ============================================== */

    button {
      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 8px;

      background: var(--tscloak-blue);

      color: white;

      font-size: 15px;

      font-weight: 600;

      cursor: pointer;

      transition:
        background 0.2s ease,
        transform 0.15s ease,
        box-shadow 0.2s ease;

      box-shadow:
        0 5px 12px rgba(31, 63, 130, 0.20);
    }

    button:hover {
      background: var(--tscloak-blue-dark);

      box-shadow:
        0 7px 18px rgba(31, 63, 130, 0.25);
    }

    button:active {
      transform: translateY(1px);
    }

    /* =============================================
       Error
    ============================================== */

    .error {
      margin-bottom: 20px;

      padding: 12px;

      background: var(--error-bg);

      border: 1px solid var(--error-border);

      border-radius: 8px;

      color: var(--error-text);

      font-size: 14px;
    }

    /* =============================================
       Footer Branding
    ============================================== */

    .footer {
      margin-top: 26px;

      text-align: center;

      color: #98a2b3;

      font-size: 11px;
    }

    .footer strong {
      color: var(--tscloak-blue);
    }

    /* =============================================
       Mobile
    ============================================== */

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .login-container {
        padding: 30px 24px;
      }

      .logo-image {
        width: 72px;
        height: 72px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <!-- =============================================
         TSCloak Branding
    ============================================== -->

    <div class="logo">

      <img
        src="/assets/tscloak-icon.png"
        alt="TSCloak"
        class="logo-image"
      />

      <h1>TSCloak</h1>

      <p>
        Secure Identities. Trusted Access.
      </p>

    </div>


    <!-- Error Placeholder -->

    {{ERROR}}


    <!-- =============================================
         Login Form
    ============================================== -->

    <form
      method="POST"
      action="/interaction/{{UID}}/login"
    >

      <div class="form-group">

        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        />

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

      </div>


      <button type="submit">
        Sign in
      </button>

    </form>


    <!-- =============================================
         Footer
    ============================================== -->

    <div class="footer">
      Secured by <strong>TSCloak</strong>
    </div>

  </div>

</body>

</html>
