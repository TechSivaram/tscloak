<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Sign in - TSClOak</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f7fa;
    }

    .login-container {
      width: 100%;
      max-width: 400px;

      padding: 32px;

      background: white;

      border-radius: 8px;

      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo h1 {
      margin: 0;
      font-size: 28px;
    }

    .logo p {
      margin-top: 8px;
      color: #666;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;

      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;

      padding: 11px 12px;

      border: 1px solid #ccc;
      border-radius: 5px;

      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #555;
    }

    button {
      width: 100%;

      padding: 12px;

      border: none;
      border-radius: 5px;

      background: #222;
      color: white;

      font-size: 15px;
      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      background: #000;
    }

    .error {
      margin-bottom: 18px;

      padding: 10px;

      background: #fff0f0;
      border: 1px solid #ffcccc;
      border-radius: 5px;

      color: #c00;

      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <h1>TSClOak</h1>
      <p>Sign in to continue</p>
    </div>

    {{ERROR}}

    <form
      method="POST"
      action="/interaction/{{UID}}"
    >

      <div class="form-group">
        <label for="username">
          Username
        </label>

        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit">
        Sign in
      </button>

    </form>

  </div>

</body>
</html>
