<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSCloak | Initial Access Token</title>
</head>

<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;">

  <table
    width="100%"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="background-color:#f4f6f8;padding:40px 20px;"
  >
    <tr>
      <td align="center">

        <table
          width="100%"
          cellpadding="0"
          cellspacing="0"
          border="0"
          style="max-width:560px;background-color:#ffffff;border-radius:8px;padding:40px;"
        >
          <tr>
            <td align="center">

              <!-- TSCloak Logo -->
              <img
                src="cid:tscloak-logo"
                alt="TSCloak"
                width="64"
                style="display:block;margin-bottom:24px;"
              />

              <h1
                style="margin:0 0 16px;font-size:24px;color:#1f2937;"
              >
                Initial Access Token
              </h1>

              <p
                style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#4b5563;"
              >
                An initial access token has been created for
                TSCloak client registration.
              </p>

              <p
                style="margin:0 0 8px;font-size:14px;font-weight:600;color:#374151;"
              >
                Initial Access Token
              </p>

              <table
                width="100%"
                cellpadding="0"
                cellspacing="0"
                border="0"
                style="margin-bottom:24px;"
              >
                <tr>
                  <td
                    style="padding:14px;background-color:#f3f4f6;border:1px solid #e5e7eb;border-radius:6px;font-family:monospace;font-size:13px;line-height:1.5;color:#111827;word-break:break-all;"
                  >
                    {{TOKEN}}
                  </td>
                </tr>
              </table>

              <a
                href="{{REGISTRATION_URL}}"
                style="display:inline-block;padding:12px 24px;background-color:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-size:16px;font-weight:600;"
              >
                Register Client
              </a>

              <p
                style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#6b7280;"
              >
                Use this token to register your OAuth/OIDC client
                with TSCloak.
              </p>

              <hr
                style="margin:32px 0 20px;border:0;border-top:1px solid #e5e7eb;"
              />

              <p
                style="margin:0;font-size:12px;color:#9ca3af;"
              >
                This is an automated message from TSCloak.
                Please do not reply to this email.
              </p>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>

</html>
